<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0A2540">
    <title>Reset Password | {{ config.APP_NAME }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
  </head>
  <body class="login-shell d-flex align-items-center justify-content-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
          <div class="crm-card shadow-lg">
            <div class="card-body p-4 p-lg-5">
              <h1 class="h4 mb-1 text-center">Reset Password</h1>
              <p class="text-center mb-4" style="color:var(--crm-text-secondary);font-size:0.875rem">
                Enter your email and we will send you a secure reset link.
              </p>

              {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                  <div class="mb-3">
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                    {% endfor %}
                  </div>
                {% endif %}
              {% endwith %}

              <form method="post" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                  <label class="form-label" for="email">Email</label>
                  <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Send Reset Link</button>
              </form>

              <div class="text-center mt-3">
                <a class="small text-decoration-none" href="{{ url_for('auth.login') }}">Back to login</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
